# The repository's default web application package. Desktop's upstream
# distribution can continue using docker-compose.yml alone and its personal package.
services:
  server:
    environment:
      TENANT_PACKAGE_DIR: ${TENANT_PACKAGE_DIR:-../config/ipix}
    volumes:
      - type: bind
        source: ./config/ipix
        target: /app/config/ipix
        read_only: true
        bind:
          create_host_path: false
